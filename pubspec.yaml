name: routina
description: 'Fondasi aplikasi perencana aktivitas personal offline.'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cryptography: ^2.9.0
  file_picker: ^11.0.2
  share_plus: ^11.1.0
  sqflite: ^2.4.2
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/font/Bricolage_Grotesque/OFL.txt
    - assets/font/Space_Mono/OFL.txt
  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/font/Bricolage_Grotesque/static/BricolageGrotesque-Regular.ttf
        - asset: assets/font/Bricolage_Grotesque/static/BricolageGrotesque-Bold.ttf
          weight: 700
    - family: Space Mono
      fonts:
        - asset: assets/font/Space_Mono/SpaceMono-Regular.ttf
        - asset: assets/font/Space_Mono/SpaceMono-Bold.ttf
          weight: 700
