name: routina
description: 'Fondasi aplikasi perencana aktivitas personal offline.'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/font/Bricolage_Grotesque/OFL.txt
  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/font/Bricolage_Grotesque/static/BricolageGrotesque-Regular.ttf
        - asset: assets/font/Bricolage_Grotesque/static/BricolageGrotesque-Bold.ttf
          weight: 700
